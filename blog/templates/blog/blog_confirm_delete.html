{% extends 'catalog/base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Подтверждение удаления</h3>
                </div>
                <div class="card-body">
                    <p class="lead">Вы уверены, что хотите удалить статью:</p>
                    <h4>"{{ object.title }}"?</h4>
                    <p class="text-muted">Это действие нельзя будет отменить.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <!-- The "Cancel" button returns to the article page. -->
                            <a href="{% url 'blog:detail' pk=object.pk %}" class="btn btn-secondary me-md-2">Отмена</a>
                            <!-- The "Delete" button sends a POST request -->
                            <button type="submit" class="btn btn-danger">Да, удалить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
