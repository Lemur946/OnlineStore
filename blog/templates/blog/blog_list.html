{% extends 'catalog/base.html' %}
{% block content %}
  <a href="{% url 'blog:create' %}" class="btn btn-primary mb-3">Создать статью</a>
  <div class="row">
    {% for object in object_list %}
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">{{ object.title }}</h5>
            <a href="{% url 'blog:detail' pk=object.pk %}" class="btn btn-primary">Читать</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
